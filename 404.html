<head>

<title>Wrong door — ZAYA</title>
<meta name="robots" content="noindex">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070404'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23B3261E'/%3E%3C/svg%3E">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 5vw;background:#070404;color:#f3ebe4;font-family:'Jost',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;text-align:center}
main{display:flex;flex-direction:column;align-items:center;gap:28px}
.dot{width:10px;height:10px;border-radius:50%;background:#7a1c16;box-shadow:0 0 18px #7a1c16;animation:dim 3.9s ease-in-out infinite}
@keyframes dim{0%,100%{opacity:.35}50%{opacity:.9}}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-style:italic;font-size:clamp(34px,5vw,56px)}
p{margin:0;max-width:380px;font-size:15px;line-height:1.85;color:#a3958d}
a{display:inline-flex;align-items:center;min-height:50px;padding:0 28px;border:1px solid rgba(233,225,218,.35);color:#f3ebe4;text-decoration:none;font-size:11px;letter-spacing:.42em;text-transform:uppercase;transition:border-color .3s,color .3s}
a:hover{border-color:#ff6b4d;color:#ff6b4d}
a:focus-visible{outline:1px solid #ff6b4d;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <span class="dot" aria-hidden="true"></span>
  <h1>This door doesn't open.</h1>
  <p>Whatever you were looking for isn't here. The ritual is the other way.</p>
  <a href="/">Back to ZAYA</a>
</main>
<script defer src="/_vercel/insights/script.js"></script>
</body>
