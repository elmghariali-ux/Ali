<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ARGANA · Text editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0705'/%3E%3Cpath d='M9 26V14a7 7 0 0 1 14 0v12' fill='none' stroke='%23D9A441' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* A quiet workbench in the site's own colours: one column of fields, one bar to publish. */
:root{--bg:#0B0705;--bg2:#140D09;--line:#2E211A;--ink:#F2E8DB;--soft:#D3C4B2;--mute:#9C8B7A;--oil:#D9A441;--ok:#8DBF7A;--bad:#E0705A;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px}
.mk{font-family:var(--display);font-weight:300;letter-spacing:.3em;font-size:13px}
header a{color:var(--soft);font-size:14px}
h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,5vw,44px);line-height:1;margin:40px 0 10px}
.intro{color:var(--mute);margin:0 0 28px}
.login{display:flex;flex-direction:column;gap:12px;max-width:380px;margin-top:20px}
label{font-size:14px;color:var(--soft)}
input[type=password]{font:inherit;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:2px}
input:focus,textarea:focus{outline:1px solid var(--oil);border-color:var(--oil)}
button{font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:2px;padding:12px 18px;min-height:44px}
.primary{background:var(--oil);border:1px solid var(--oil);color:var(--bg);font-weight:500}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.small{font-size:11px;padding:6px 10px;min-height:0}
.msg{font-size:14px;min-height:1.4em}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.group{margin-top:34px}
.group h2{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--oil);font-weight:500;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.field .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field .help{font-size:13px;color:var(--mute)}
.field.changed label::after{content:"  · changed";color:var(--oil)}
textarea{font:inherit;font-size:16px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:2px;resize:vertical;line-height:1.55;width:100%}
.bar{position:sticky;bottom:0;background:rgba(11,7,5,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);margin-top:30px;padding-bottom:env(safe-area-inset-bottom)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.bar .actions{display:flex;gap:10px}

/* High-end type pass (ZAYA family): light serif headlines, wide-tracked light sans for names and labels. */
h1,h2,h3,.h,.big,.book-big,.lede{font-weight:300!important;letter-spacing:0!important}
.name,.mk,.zaya-word,.gate h1{font-family:var(--sans)!important;font-weight:300!important;text-transform:uppercase}
.name{letter-spacing:.42em!important;line-height:1!important}
.mk{letter-spacing:.5em!important}
.cap,.num,.eyebrow,.t{letter-spacing:.42em!important;font-weight:400!important}
.nums b,.stats b,.facts b{font-weight:300!important;letter-spacing:0!important}
</style>
</head>
<body>
<header><div class="wrap"><span class="mk">ARGANA</span><a href="/" target="_blank" rel="noopener">View the site ↗</a></div></header>

<main class="wrap">
  <h1>Text editor</h1>
  <p class="intro">Change the words on arganamusic.com. Press Publish and the site updates within a minute.</p>

  <form class="login" id="login">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="primary" type="submit">Open the editor</button>
    <p class="msg" id="loginmsg" role="status"></p>
  </form>

  <div id="editor" hidden></div>
</main>

<div class="bar" id="bar" hidden><div class="wrap">
  <span class="msg" id="msg" role="status">No changes yet.</span>
  <div class="actions"><button class="ghost" type="button" id="undo">Undo changes</button><button class="primary" type="button" id="publish">Publish</button></div>
</div></div>

<script>
(function(){
  var pw = '', data = null, saved = {};
  var $ = function(id){ return document.getElementById(id); };
  try { pw = sessionStorage.getItem('argana-pw') || ''; } catch(e) {}

  function api(method, body){
    return fetch('/api/content', { method: method, headers: { 'Content-Type': 'application/json', 'x-admin-password': pw }, body: body ? JSON.stringify(body) : undefined })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }

  function load(){
    return api('GET').then(function(j){
      data = j; saved = Object.assign({}, j.values);
      try { sessionStorage.setItem('argana-pw', pw); } catch(e) {}
      $('login').hidden = true; $('editor').hidden = false; $('bar').hidden = false;
      build();
    });
  }

  function build(){
    var ed = $('editor'); ed.replaceChildren(); var groups = {};
    data.fields.forEach(function(f){
      if(!groups[f.group]){ var g = document.createElement('section'); g.className = 'group'; var h = document.createElement('h2'); h.textContent = f.group; g.append(h); ed.append(g); groups[f.group] = g; }
      var wrap = document.createElement('div'); wrap.className = 'field'; wrap.dataset.key = f.key;
      var top = document.createElement('div'); top.className = 'top';
      var lab = document.createElement('label'); lab.htmlFor = 'f-' + f.key; lab.textContent = f.label;
      var reset = document.createElement('button'); reset.type = 'button'; reset.className = 'ghost small'; reset.textContent = 'Original';
      reset.title = 'Put back the text the site launched with';
      top.append(lab, reset);
      var ta = document.createElement('textarea'); ta.id = 'f-' + f.key; ta.rows = f.rows || 3; ta.value = data.values[f.key] || '';
      ta.addEventListener('input', status);
      reset.addEventListener('click', function(){ ta.value = data.defaults[f.key] || ''; status(); });
      wrap.append(top, ta);
      if(f.help){ var p = document.createElement('span'); p.className = 'help'; p.textContent = f.help; wrap.append(p); }
      groups[f.group].append(wrap);
    });
    status();
  }

  function current(){ var v = {}; data.fields.forEach(function(f){ v[f.key] = $('f-' + f.key).value; }); return v; }
  function status(){
    var v = current(), n = 0;
    data.fields.forEach(function(f){ var ch = v[f.key] !== saved[f.key]; if(ch) n++; document.querySelector('.field[data-key="' + f.key + '"]').classList.toggle('changed', ch); });
    var m = $('msg'); m.className = 'msg';
    m.textContent = n ? n + (n === 1 ? ' text changed, not published yet.' : ' texts changed, not published yet.') : 'Everything is published.';
    $('publish').disabled = !n; $('undo').disabled = !n;
  }

  $('login').addEventListener('submit', function(e){
    e.preventDefault(); pw = $('pw').value; $('loginmsg').className = 'msg'; $('loginmsg').textContent = 'Opening…';
    load().catch(function(err){ $('loginmsg').className = 'msg bad'; $('loginmsg').textContent = err.message === 'Wrong password' ? 'That password is not right. Try again.' : err.message; });
  });
  $('undo').addEventListener('click', function(){ data.fields.forEach(function(f){ $('f-' + f.key).value = saved[f.key] || ''; }); status(); });
  $('publish').addEventListener('click', function(){
    var b = $('publish'), m = $('msg'); b.disabled = true; m.className = 'msg'; m.textContent = 'Publishing…';
    var v = current();
    api('POST', { values: v }).then(function(){
      saved = Object.assign({}, v); status();
      m.className = 'msg ok'; m.textContent = 'Published. The site shows it within a minute.';
    }).catch(function(err){ m.className = 'msg bad'; m.textContent = 'Not published: ' + err.message; b.disabled = false; });
  });
  addEventListener('beforeunload', function(e){ if(data && !$('publish').disabled){ e.preventDefault(); e.returnValue = ''; } });

  if(pw) load().catch(function(){ pw = ''; try { sessionStorage.removeItem('argana-pw'); } catch(e) {} });
})();
</script>
</body>
</html>
